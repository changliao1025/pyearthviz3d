name: CI Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system graphics dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglx-mesa0 libosmesa6 xvfb

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pyearthviz3d-test
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
              - nodefaults
          create-args: >-
            python=${{ matrix.python-version }}
            numpy
            gdal>=3.0
            geovista
            pyvista
            pyearth>=0.2.5
            imageio
            pytest
            pytest-cov
            wheel
            setuptools
          cache-environment: true
          cache-environment-key: micromamba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Package
        shell: bash -el {0}
        run: |
          pip install --no-build-isolation --no-deps -e .

      - name: Run Test Suite (Linux)
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          xvfb-run -a pytest -ra -v --cov=pyearthviz3d --cov-report=xml test/

      - name: Run Test Suite (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          pytest -ra -v --cov=pyearthviz3d --cov-report=xml test/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
