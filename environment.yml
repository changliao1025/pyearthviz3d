name: pyearthviz3d
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.10

  # Core dependencies (from pyproject.toml)
  - numpy
  - gdal>=3.0
  - pyvista
  - geovista
  - pyearth>=0.2.4

  # Development dependencies (optional-dependencies.dev from pyproject.toml)
  - pytest>=7.0.0
  - pytest-cov>=3.0.0
  - black>=22.0.0
  - flake8>=4.0.0
  - mypy>=0.950

  # Jupyter interactive dependencies (optional-dependencies.jupyter from pyproject.toml)
  - ipywidgets>=8.0.0
  - trame>=3.5.0
  - trame-vtk>=2.8.0
  - trame-vuetify>=2.4.0

  # Documentation dependencies (optional-dependencies.docs from pyproject.toml)
  - sphinx>=5.0.0
  - sphinx_rtd_theme>=1.0.0
  - myst-parser>=0.18.0
  - sphinx-copybutton>=0.5.0

  # Build tools
  - setuptools>=61.0
  - wheel
  - build
